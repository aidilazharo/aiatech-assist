name: Publish verified ATGV v0.3.50 code update

on:
  push:
    branches: [main]
    paths:
      - .atgv-updates/READY
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atgv-v350-apply-main
  cancel-in-progress: false

jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify staged source patch and apply against main
        shell: bash
        run: |
          set -euo pipefail
          patch=.atgv-updates/v0.3.50-source.patch
          echo 'a766b386dcceebbd49e78af1fcf4394e187c2a300ef8ad4c2b195828a12d14d0  .atgv-updates/v0.3.50-source.patch' | sha256sum --check
          test "$(node -p "require('./package.json').version")" = "0.3.49"
          git apply --check "$patch"
          git apply --whitespace=nowarn "$patch"
          test "$(node -p "require('./package.json').version")" = "0.3.50"
          rm -rf .atgv-updates
      - name: Commit updated extension source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ATGV v0.3.50 configurable verified GitHub release URL"
          git push origin HEAD:main
      - name: Trigger full test and VSIX release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-release-vsix.yml --ref main
          echo 'v0.3.50 source published; full GitHub VSIX release build requested.' >> "$GITHUB_STEP_SUMMARY"
