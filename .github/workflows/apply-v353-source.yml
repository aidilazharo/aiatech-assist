name: Import verified ATGV v0.3.53 source

on:
  push:
    branches: [main]
    paths: ['.atgv-updates/READY']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atgv-verified-v353-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact source patch and apply
        shell: bash
        run: |
          set -euo pipefail
          cat .atgv-updates/v353-patch-{0,1,2}.b64 | base64 --decode > /tmp/atgv-v353.patch
          echo 'af755aa68b08efe102873e6a78546948a3a148a00ec0c2a242d58117a4c41221  /tmp/atgv-v353.patch' | sha256sum --check
          test "$(node -p "require('./package.json').version")" = "0.3.52"
          git apply --check /tmp/atgv-v353.patch
          git apply --whitespace=nowarn /tmp/atgv-v353.patch
          test "$(node -p "require('./package.json').version")" = "0.3.53"
          node --check src/architect-scaffold-migration.js
          node --check src/architect-stack-bootstrap.js
          node --check src/architect-simple-workflow.js
          test -f test/v353-scaffold-migration-v2.test.js
          rm -rf .atgv-updates
          rm -f .github/workflows/apply-v353-source.yml
      - name: Publish verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ATGV v0.3.53 safe committed-scaffold migration v2"
          git push origin HEAD:main
      - name: Trigger full VSIX regression and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-release-vsix.yml --ref main
          echo 'ATGV v0.3.53 source published; full test/VSIX release requested.' >> "$GITHUB_STEP_SUMMARY"
