name: Apply verified ATGV v0.3.51 source update

on:
  push:
    branches: [main]
    paths:
      - .atgv-updates/READY
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atgv-v351-source-apply-main
  cancel-in-progress: false

jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify complete ATGV source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .atgv-updates/v0.3.51-part-0.patch .atgv-updates/v0.3.51-part-1.patch > /tmp/atgv-v351.patch
          echo '734e5ab6f233d833ddeecba4aae5f095c467c90f7b2bbf207f4e1f36e388419a  /tmp/atgv-v351.patch' | sha256sum --check
          test "$(node -p "require('./package.json').version")" = "0.3.50"
          git apply --check /tmp/atgv-v351.patch
          git apply --whitespace=nowarn /tmp/atgv-v351.patch
          test "$(node -p "require('./package.json').version")" = "0.3.51"
          test -f src/lib/startup-readiness.js
          test -f src/lib/startup-setup.js
          rm -rf .atgv-updates
      - name: Publish ATGV 0.3.51 source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v0.3.51 AIA startup readiness and extension upgrade branding"
          git push origin HEAD:main
      - name: Trigger VSIX verification and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-release-vsix.yml --ref main
          echo "ATGV v0.3.51 source published and VSIX release build requested." >> "$GITHUB_STEP_SUMMARY"
