name: Build and release ATGV VSIX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: atgv-vsix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and package VSIX
    runs-on: ${{ vars.ATGV_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      source_ready: ${{ steps.source.outputs.ready }}
      version: ${{ steps.meta.outputs.version }}
      filename: ${{ steps.meta.outputs.filename }}
      source_filename: ${{ steps.meta.outputs.source_filename }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for ATGV source
        id: source
        shell: bash
        run: |
          if [[ -f package.json && -f src/extension.js && -f scripts/build-vsix.js ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'ATGV source is not yet committed; skipping packaging and release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read extension version
        if: steps.source.outputs.ready == 'true'
        id: meta
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = require('./package.json');
          if (pkg.name !== 'atgv-aiatech-assist' || !/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error('Unexpected ATGV package name or version');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'version=' + pkg.version + '\n' +
            'filename=' + pkg.name + '-' + pkg.version + '.vsix\n' +
            'source_filename=ATGV-AIATECH-Assist-v' + pkg.version + '-Source.zip\n');
          NODE

      - name: Install pinned build-only minifiers
        if: steps.source.outputs.ready == 'true'
        run: npm install --ignore-scripts --no-save --no-package-lock --no-audit --no-fund

      - name: Verify the Copilot SDK runtime
        if: steps.source.outputs.ready == 'true'
        run: node scripts/verify-copilot-sdk.js

      - name: Run regression suite
        if: steps.source.outputs.ready == 'true'
        run: npm test

      - name: Validate UI theme
        if: steps.source.outputs.ready == 'true'
        run: npm run ui:check

      - name: Compile and verify VSIX
        if: steps.source.outputs.ready == 'true'
        run: npm run package

      - name: Verify VSIX output and checksum
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          FILE: ${{ steps.meta.outputs.filename }}
        run: |
          test -s "../$FILE"
          test -s dist/vsix-size-report.json
          test -s dist/vsix-size-report.md
          mkdir -p dist
          cp "../$FILE" "dist/$FILE"
          (cd dist && sha256sum "$FILE" > vsix.sha256)
          {
            echo "### ATGV v${{ steps.meta.outputs.version }}"
            echo "VSIX: $FILE"
            echo 'Tests and VSIX activation verification passed.'
            echo 'SHA-256:'
            cat dist/vsix.sha256
            cat dist/vsix-size-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive committed source and verify ZIP
        if: steps.source.outputs.ready == 'true'
        shell: bash
        env:
          SOURCE_FILE: ${{ steps.meta.outputs.source_filename }}
          SOURCE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="ATGV-AIATECH-Assist-v${SOURCE_VERSION}-Source/" -o "dist/${SOURCE_FILE}" HEAD
          test -s "dist/${SOURCE_FILE}"
          unzip -tqq "dist/${SOURCE_FILE}"
          if unzip -Z1 "dist/${SOURCE_FILE}" | grep -E '(^|/)\.memory(/|$)'; then
            echo "ERROR: .memory must not be distributed in the extension source ZIP" >&2
            exit 1
          fi
          echo "Verified: no .memory directory in the source ZIP" >> "$GITHUB_STEP_SUMMARY"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          unzip -q "dist/${SOURCE_FILE}" -d "$extracted"
          node --test "$extracted/ATGV-AIATECH-Assist-v${SOURCE_VERSION}-Source/test/v001-decision-memory.test.js" "$extracted/ATGV-AIATECH-Assist-v${SOURCE_VERSION}-Source/test/v002-release-memory-exclusion.test.js"
          echo "Verified: extracted source ZIP tests passed without .memory" >> "$GITHUB_STEP_SUMMARY"
          (cd dist && sha256sum "${SOURCE_FILE}" > source.sha256)
          echo "Complete source ZIP: ${SOURCE_FILE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX and source ZIP build artifacts
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atgv-vsix-${{ steps.meta.outputs.version }}-build-${{ github.run_number }}
          path: |
            dist/${{ steps.meta.outputs.filename }}
            dist/vsix.sha256
            dist/vsix-size-report.json
            dist/vsix-size-report.md
            dist/${{ steps.meta.outputs.source_filename }}
            dist/source.sha256
          if-no-files-found: error
          retention-days: 90

  windows-reset:
    name: Test Windows stack reset
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reset and startup layout on Windows
        run: node --test test/v398-reset-workspace-alias.test.js test/v398-startup-layout.test.js

  release:
    name: Publish GitHub prerelease
    needs: [build, windows-reset]
    if: needs.build.outputs.source_ready == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ vars.ATGV_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: atgv-vsix-${{ needs.build.outputs.version }}-build-${{ github.run_number }}
          path: dist

      - name: Publish release for this main commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          FILE: ${{ needs.build.outputs.filename }}
          SOURCE_FILE: ${{ needs.build.outputs.source_filename }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-build.${BUILD_NUMBER}"
          test -s "dist/${FILE}"
          test -s "dist/${SOURCE_FILE}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "dist/${FILE}" "dist/vsix.sha256" "dist/vsix-size-report.json" "dist/vsix-size-report.md" "dist/${SOURCE_FILE}" "dist/source.sha256" \
              --target "$SOURCE_SHA" \
              --title "ATGV v${VERSION} (build ${BUILD_NUMBER})" \
              --notes "Automated main-branch VSIX build. Source commit: ${SOURCE_SHA}. Regression suite and package verification passed." \
              --prerelease \
              --latest=false
          else
            gh release upload "$tag" "dist/${FILE}" "dist/vsix.sha256" "dist/vsix-size-report.json" "dist/vsix-size-report.md" "dist/${SOURCE_FILE}" "dist/source.sha256" --clobber
          fi
          echo "GitHub prerelease: $tag" >> "$GITHUB_STEP_SUMMARY"
