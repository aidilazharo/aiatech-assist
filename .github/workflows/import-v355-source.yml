name: Import verified ATGV v0.3.55 source

on:
  push:
    branches: [main]
    paths:
      - .atgv-updates/READY
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atgv-v355-source-import
  cancel-in-progress: false

jobs:
  verified-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact patch and apply to v0.3.53
        shell: bash
        run: |
          set -euo pipefail
          cat .atgv-updates/v355-part-{000,001,002,003}.b64 | base64 --decode > /tmp/atgv-v355.patch
          echo '191cfe01dd8fb01184cb2d9075773d7f43c650686f479248fc1e8bbcefe45cbc  /tmp/atgv-v355.patch' | sha256sum --check
          test "$(node -p "require('./package.json').version")" = "0.3.53"
          git apply --check /tmp/atgv-v355.patch
          git apply --whitespace=nowarn /tmp/atgv-v355.patch
          test "$(node -p "require('./package.json').version")" = "0.3.55"
          test -f test/v354-manual-project-start.test.js
          test -f test/v355-server-lifecycle-and-push.test.js
          node --check src/architect-stack-bootstrap.js
          node --check src/architect-server-verification.js
          node --check src/lib/runtime/extension-runtime.js
          node --check media/start.js
          rm -rf .atgv-updates
          rm -f .github/workflows/import-v355-source.yml
      - name: Commit tested source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: v0.3.55 remote branch diagnostics and verified server lifecycle"
          git push origin HEAD:main
      - name: Trigger full regression and VSIX release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-release-vsix.yml --ref main
          echo 'v0.3.55 source committed to main and VSIX build requested.' >> "$GITHUB_STEP_SUMMARY"
